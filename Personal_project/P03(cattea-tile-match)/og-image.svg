<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Cattea — Triple Tile Match">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffe3f1"/>
      <stop offset="40%"  stop-color="#ffd6e6"/>
      <stop offset="100%" stop-color="#c2e6ff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#8a4a2a" flood-opacity="0.3"/>
    </filter>
    <style>
      .title { font: 900 120px -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; fill: #d63384; letter-spacing: -2px; }
      .sub   { font: 700 34px -apple-system, "Segoe UI", sans-serif; fill: #8a4a6a; letter-spacing: 8px; }
      .hook  { font: 800 52px -apple-system, "Segoe UI", sans-serif; fill: #4a2c1a; }
      .hookA { font: 800 52px -apple-system, "Segoe UI", sans-serif; fill: #d63384; }
      .foot  { font: 700 20px -apple-system, "Segoe UI", sans-serif; fill: #8a4a6a; }
      .footU { font: 700 20px -apple-system, "Segoe UI", sans-serif; fill: #d63384; }
      .deco  { font: 96px sans-serif; opacity: 0.35; }
      .emoji { font: 42px sans-serif; }
      .big   { font: 88px sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative floating emoji -->
  <text class="deco" x="60"   y="120" transform="rotate(-12 108 96)">🐱</text>
  <text class="deco" x="1020" y="170" transform="rotate(18 1068 146)">🐟</text>
  <text class="deco" x="100"  y="560" transform="rotate(8 148 536)">🧶</text>
  <text class="deco" x="1040" y="580" transform="rotate(-14 1088 556)">🐾</text>
  <text class="deco" x="20"   y="330" transform="rotate(22 68 306)" style="font-size:80px">🔔</text>
  <text class="deco" x="1120" y="370" transform="rotate(-18 1160 346)" style="font-size:80px">⭐</text>

  <!-- Brand -->
  <g transform="translate(600 200)" text-anchor="middle">
    <text class="big" x="-230" y="0">🐱</text>
    <text class="title" x="40" y="10" filter="url(#softShadow)">Cattea</text>
  </g>

  <text class="sub" x="600" y="260" text-anchor="middle">TRIPLE TILE MATCH</text>

  <!-- Hook card -->
  <g transform="translate(600 380)">
    <rect x="-420" y="-56" width="840" height="112" rx="24" ry="24"
          fill="rgba(255,255,255,0.88)" filter="url(#softShadow)"/>
    <text class="hook" x="-300" y="20" text-anchor="start">Can you clear </text>
    <text class="hookA" x="225" y="20" text-anchor="end">all 30 stages?</text>
  </g>

  <!-- Tile strip -->
  <g transform="translate(600 500)">
    <!-- 10 tiles, 72px wide, 14px gap → total 860 → center at -430 offset -->
    <g id="tilesStrip">
      <g transform="translate(-430 0)"><rect width="72" height="72" rx="14" fill="#fff" filter="url(#tileShadow)"/><text class="emoji" x="36" y="52" text-anchor="middle">🐱</text></g>
      <g transform="translate(-344 0)"><rect width="72" height="72" rx="14" fill="#fff" filter="url(#tileShadow)"/><text class="emoji" x="36" y="52" text-anchor="middle">🐟</text></g>
      <g transform="translate(-258 0)"><rect width="72" height="72" rx="14" fill="#fff" filter="url(#tileShadow)"/><text class="emoji" x="36" y="52" text-anchor="middle">🍩</text></g>
      <g transform="translate(-172 0)"><rect width="72" height="72" rx="14" fill="#fff" filter="url(#tileShadow)"/><text class="emoji" x="36" y="52" text-anchor="middle">🥛</text></g>
      <g transform="translate(-86 0)"><rect width="72" height="72" rx="14" fill="#fff" filter="url(#tileShadow)"/><text class="emoji" x="36" y="52" text-anchor="middle">🧶</text></g>
      <g transform="translate(0 0)"><rect width="72" height="72" rx="14" fill="#fff" filter="url(#tileShadow)"/><text class="emoji" x="36" y="52" text-anchor="middle">🐾</text></g>
      <g transform="translate(86 0)"><rect width="72" height="72" rx="14" fill="#fff" filter="url(#tileShadow)"/><text class="emoji" x="36" y="52" text-anchor="middle">🔔</text></g>
      <g transform="translate(172 0)"><rect width="72" height="72" rx="14" fill="#fff" filter="url(#tileShadow)"/><text class="emoji" x="36" y="52" text-anchor="middle">⭐</text></g>
      <g transform="translate(258 0)"><rect width="72" height="72" rx="14" fill="#fff" filter="url(#tileShadow)"/><text class="emoji" x="36" y="52" text-anchor="middle">💖</text></g>
      <g transform="translate(344 0)"><rect width="72" height="72" rx="14" fill="#fff" filter="url(#tileShadow)"/><text class="emoji" x="36" y="52" text-anchor="middle">👑</text></g>
    </g>
  </g>

  <!-- Footer -->
  <text class="foot"  x="60"   y="600" text-anchor="start">Free · No install · Web browser</text>
  <text class="footU" x="1140" y="600" text-anchor="end">csparkzxc1.github.io</text>
</svg>
