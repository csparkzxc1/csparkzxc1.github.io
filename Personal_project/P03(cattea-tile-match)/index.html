<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cattea — Triple Tile Match</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="hud">
      <div class="hud-item">
        <span class="label">LEVEL</span>
        <span id="level" class="value">1</span>
      </div>
      <div class="hud-item">
        <span class="label">SCORE</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="hud-item">
        <span class="label">TILES</span>
        <span id="remaining" class="value">0</span>
      </div>
    </header>

    <main id="board" class="board" aria-label="Tile board"></main>

    <section class="tray" aria-label="Slot tray">
      <div class="slot" data-slot="0"></div>
      <div class="slot" data-slot="1"></div>
      <div class="slot" data-slot="2"></div>
      <div class="slot" data-slot="3"></div>
      <div class="slot" data-slot="4"></div>
      <div class="slot" data-slot="5"></div>
      <div class="slot" data-slot="6"></div>
    </section>

    <section class="boosters">
      <button class="booster" id="btn-undo" aria-label="Undo">
        <span class="icon">↶</span>
        <span class="name">Undo</span>
        <span class="count" id="count-undo">3</span>
      </button>
      <button class="booster" id="btn-magnet" aria-label="Magnet">
        <span class="icon">🧲</span>
        <span class="name">Magnet</span>
        <span class="count" id="count-magnet">2</span>
      </button>
      <button class="booster" id="btn-shuffle" aria-label="Shuffle">
        <span class="icon">🔀</span>
        <span class="name">Shuffle</span>
        <span class="count" id="count-shuffle">2</span>
      </button>
    </section>

    <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
      <div class="overlay-card">
        <h2 id="overlay-title">Stage Clear!</h2>
        <p id="overlay-msg">+120 score</p>
        <div class="overlay-buttons">
          <button id="overlay-primary" class="btn btn-primary">Next</button>
          <button id="overlay-secondary" class="btn btn-secondary">Retry</button>
        </div>
      </div>
    </div>

    <footer class="credit">
      <a href="../../index.html" aria-label="Home">← Home</a>
      <span>Cattea Clone Prototype · 3-Tile Match</span>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
