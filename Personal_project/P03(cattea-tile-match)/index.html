<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cattea — Triple Tile Match</title>
  <link rel="stylesheet" href="style.css">

  <!-- Google Analytics 4 — replace G-XXXXXXXXXX with your Measurement ID -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX', { debug_mode: true });
  </script>
</head>
<body>
  <!-- ================== Stage Select Screen ================== -->
  <section id="stage-select" class="stage-select">
    <header class="ss-header">
      <a class="ss-home" href="../../index.html" aria-label="Home">←</a>
      <h1>Stage Select</h1>
      <button class="ss-reset" id="btn-reset" aria-label="Reset progress">↺</button>
    </header>
    <div class="ss-stats">
      <span>★ <b id="ss-cleared">0</b>/<span id="ss-total">30</span></span>
      <span>Score <b id="ss-score">0</b></span>
      <span>🧲 <b id="ss-undo">3</b> · <b id="ss-magnet">2</b> · <b id="ss-shuffle">2</b></span>
    </div>
    <div id="stage-grid" class="ss-grid" role="list"></div>
  </section>

  <!-- ================== Game Screen ================== -->
  <div id="app" class="hidden">
    <header class="hud">
      <button class="hud-back" id="btn-back" aria-label="Back to stage select">←</button>
      <div class="hud-item">
        <span class="label">STAGE</span>
        <span id="level" class="value">1</span>
      </div>
      <div class="hud-item">
        <span class="label">SCORE</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="hud-item">
        <span class="label" id="rem-label">TILES</span>
        <span id="remaining" class="value">0</span>
      </div>
    </header>

    <main id="board" class="board" aria-label="Tile board"></main>

    <section class="tray" aria-label="Slot tray">
      <div class="slot" data-slot="0"></div>
      <div class="slot" data-slot="1"></div>
      <div class="slot" data-slot="2"></div>
      <div class="slot" data-slot="3"></div>
      <div class="slot" data-slot="4"></div>
      <div class="slot" data-slot="5"></div>
      <div class="slot" data-slot="6"></div>
    </section>

    <section class="boosters">
      <button class="booster" id="btn-undo" aria-label="Undo">
        <span class="icon">↶</span>
        <span class="name">Undo</span>
        <span class="count" id="count-undo">3</span>
      </button>
      <button class="booster" id="btn-magnet" aria-label="Magnet">
        <span class="icon">🧲</span>
        <span class="name">Magnet</span>
        <span class="count" id="count-magnet">2</span>
      </button>
      <button class="booster" id="btn-shuffle" aria-label="Shuffle">
        <span class="icon">🔀</span>
        <span class="name">Shuffle</span>
        <span class="count" id="count-shuffle">2</span>
      </button>
    </section>

    <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
      <div class="overlay-card">
        <h2 id="overlay-title">Stage Clear!</h2>
        <p id="overlay-msg">+120 score</p>
        <div class="overlay-buttons">
          <button id="overlay-primary" class="btn btn-primary">Next</button>
          <button id="overlay-secondary" class="btn btn-secondary">Retry</button>
        </div>
      </div>
    </div>

    <footer class="credit">
      <a href="../../index.html" aria-label="Home">← Home</a>
      <span>Cattea Clone Prototype · 30 Stages</span>
    </footer>
  </div>

  <script src="game-integration.js"></script>
  <script src="game.js"></script>
</body>
</html>
